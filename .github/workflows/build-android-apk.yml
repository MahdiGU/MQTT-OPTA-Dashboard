name: Build Android APK

on:
  push:
    branches:
      - Poultry_Demo_Arduino
      - Poultry_Demo_Android_Background
      - Poultry_Demo_Supabase
      - Android_Supabase_Cutover
      - Android_Supabase_Realtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Create named install package
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ElMajd-Automation-1.8.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElMajd-Automation-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/ElMajd-Automation-1.8.2.apk
          if-no-files-found: error
          retention-days: 30
