name: Build Android APK

on:
  push:
    branches:
      - Poultry_Demo_Arduino
      - Poultry_Demo_Android_Background
      - Poultry_Demo_Supabase
      - Android_Supabase_Cutover
      - Android_Supabase_Realtime
      - Phase_5_Android_App
      - Phase_5_App_Refinements
      - Phase_3_FCM_Delivery
      - French_Account_Gmail
      - Fix_Supabase_Telemetry_2026_11_04
      - Opta_Feed_Chain_Expansion
      - Android_Three_Designs
      - Android_FLOW_Design
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node for the offline 3D bundle
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify the 3D bundle and phone interface
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build:3d
          git diff --exit-code -- app/src/main/assets/live3d-scene.bundle.js app/src/main/assets/THREE-LICENSE.txt
          pnpm exec playwright install --with-deps chromium
          pnpm test:ui

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify release compilation without production credentials
        run: gradle --no-daemon :app:assembleRelease -PelmajdUnsignedReleaseCheck=true

      - name: Verify pilot APK signature
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$signer" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Create named install package
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ElMajd-Automation-1.16.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElMajd-Automation-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/ElMajd-Automation-1.16.0.apk
          if-no-files-found: error
          retention-days: 30
